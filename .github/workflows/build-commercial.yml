name: SmartCompany Commercial Release
on:
  workflow_dispatch:
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Validate release signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.SMARTCOMPANY_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.SMARTCOMPANY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SMARTCOMPANY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SMARTCOMPANY_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || (echo "Missing SMARTCOMPANY_KEYSTORE_B64" && exit 1)
          test -n "$STORE_PASSWORD" || (echo "Missing SMARTCOMPANY_STORE_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing SMARTCOMPANY_KEY_ALIAS" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing SMARTCOMPANY_KEY_PASSWORD" && exit 1)
          echo "$KEYSTORE_B64" | base64 --decode > smartcompany-release.jks
      - name: Build signed commercial APK and AAB
        env:
          SMARTCOMPANY_KEYSTORE_FILE: smartcompany-release.jks
          SMARTCOMPANY_STORE_PASSWORD: ${{ secrets.SMARTCOMPANY_STORE_PASSWORD }}
          SMARTCOMPANY_KEY_ALIAS: ${{ secrets.SMARTCOMPANY_KEY_ALIAS }}
          SMARTCOMPANY_KEY_PASSWORD: ${{ secrets.SMARTCOMPANY_KEY_PASSWORD }}
        run: gradle clean assembleRelease bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SmartCompany-v1.0.1-commercial
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
      - name: Remove signing material
        if: always()
        run: rm -f smartcompany-release.jks
